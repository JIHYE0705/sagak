name: Export design reference images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/reference/**'
      - '.github/workflows/design-preview.yml'

permissions:
  contents: write

concurrency:
  group: design-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install preview renderer
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render final design references
        run: node docs/reference/export-preview.cjs
      - name: Retain generated images
        uses: actions/upload-artifact@v4
        with:
          name: sagak-design-reference
          path: docs/images/*.png
      - name: Save images to the repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/images/notebook-daheng.png docs/images/notebook-settings.png
          if ! git diff --cached --quiet; then
            git commit -m 'docs: 최종 다행체 시안 이미지 저장'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
